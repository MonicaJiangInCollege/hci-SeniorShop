<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>老年极简购物助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #FFF8F0;
            padding: 8px 6px;
            font-size: 15px;
            line-height: 1.4;
            max-width: 600px;
            margin: 0 auto;
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .title {
            font-size: 24px;
            text-align: center;
            margin: 12px 0 18px 0;
            font-weight: bold;
            color: #222222;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn {
            position: relative;
            height: 120px;
            font-size: 20px;
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        .btn img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .back {
            width: 100%;
            height: 48px;
            background: #8D6E63;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .back:hover {
            background: #6D4C41;
        }

        /* 暖色养老风格：米白 + 橙色 */
        .food {
            background: #FF8C42;
        }
        .daily {
            background: #FFA726;
        }
        .medicine {
            background: #FB8C00;
        }
        .look {
            background: #FFE0B2;
            color: #5D4037;
        }
        .cart {
            background: #FF8C42;
        }
        .pay {
            background: #E65100;
        }
        .add {
            background: #FF8C42;
            width: 100%;
            height: 48px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            color: white;
            margin: 8px 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add:hover {
            background: #F57C00;
        }

        .goods-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .goods-item {
            border: 2px solid #FFE0B2;
            border-radius: 12px;
            padding: 8px;
            background: #FFFDF9;
            box-shadow: 0 2px 6px rgba(255,140,66,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .goods-image {
            width: 100%;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #f0f0f0;
        }

        .goods-emoji {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .emoji-food { background: #FFF3E0; }
        .emoji-daily { background: #E8F5E9; }
        .emoji-medicine { background: #F3E5F5; }

        .goods-name {
            font-size: 14px;
            font-weight: bold;
            color: #222222;
            text-align: center;
        }

        .goods-desc {
            font-size: 11px;
            color: #666;
            margin: 3px 0;
            text-align: center;
        }

        .goods-price {
            color: #E65100;
            font-size: 16px;
            font-weight: bold;
            margin: 6px 0;
        }

        .cart-item {
            padding: 8px;
            border: 2px solid #FFE0B2;
            border-radius: 10px;
            margin: 8px 0;
            font-size: 14px;
            background: #FFFDF9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-remove {
            background: #E65100;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #E65100;
            margin: 12px 0;
        }

        /* 登录/注册页面样式 */
        .auth-container {
            max-width: 360px;
            margin: 20px auto;
            background: #FFFDF9;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 12px rgba(255,140,66,0.12);
        }

        .auth-title {
            font-size: 24px;
            text-align: center;
            margin-bottom: 18px;
            color: #222;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            height: 42px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 0 12px;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #FF8C42;
        }

        .auth-btn {
            width: 100%;
            height: 46px;
            font-size: 18px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background: #F57C00;
        }

        .auth-switch {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }

        .auth-switch a {
            color: #FF8C42;
            cursor: pointer;
            text-decoration: underline;
        }

        .user-info {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .hidden {
            display: none !important;
        }

        /* 子女代付页面样式 */
        .order-card {
            border: 2px solid #FFE0B2;
            border-radius: 14px;
            padding: 12px;
            background: #FFFDF9;
            box-shadow: 0 2px 6px rgba(255,140,66,0.1);
            margin-bottom: 14px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-id {
            font-size: 12px;
            color: #666;
        }

        .order-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .order-status.pending {
            background: #FFF3E0;
            color: #F7931E;
        }

        .order-status.paid {
            background: #E8F5E9;
            color: #58B352;
        }

        .order-items {
            font-size: 13px;
            margin: 8px 0;
        }

        .order-item-row {
            padding: 4px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-total {
            font-size: 18px;
            font-weight: bold;
            color: #E65100;
            text-align: right;
            margin: 10px 0;
        }

        .pay-btn {
            width: 100%;
            height: 46px;
            font-size: 18px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .pay-btn:hover {
            background: #F57C00;
        }

        .pay-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .empty-tip {
            text-align: center;
            font-size: 18px;
            color: #999;
            margin: 24px 0;
        }

        /* 搜索框样式 */
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            height: 48px;
            font-size: 18px;
            border: 3px solid #FFE0B2;
            border-radius: 14px;
            padding: 0 16px;
            background: #FFFDF9;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #FF8C42;
        }

        .search-input::placeholder {
            color: #bbb;
            font-size: 16px;
        }

        .search-btn {
            width: 80px;
            height: 48px;
            font-size: 18px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: #F57C00;
        }

        /* 推荐区样式 */
        .recommend-section {
            margin-top: 18px;
            margin-bottom: 18px;
        }

        .recommend-title {
            font-size: 22px;
            font-weight: bold;
            color: #E65100;
            text-align: center;
            margin-bottom: 12px;
        }

        .recommend-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .recommend-item {
            border: 2px solid #FFCC80;
            border-radius: 14px;
            padding: 10px;
            background: linear-gradient(135deg, #FFFDF9, #FFF8F0);
            box-shadow: 0 2px 8px rgba(255,140,66,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .recommend-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,140,66,0.2);
        }

        .recommend-image {
            width: 100%;
            height: 72px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 6px;
            background: #f0f0f0;
        }

        .recommend-emoji {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .recommend-name {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        .recommend-tag {
            font-size: 11px;
            color: #FF8C42;
            background: #FFF3E0;
            padding: 2px 8px;
            border-radius: 6px;
            margin: 4px 0;
        }

        .recommend-price {
            font-size: 17px;
            font-weight: bold;
            color: #E65100;
            margin: 4px 0;
        }

        .recommend-add {
            width: 100%;
            height: 38px;
            font-size: 14px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .recommend-add:hover {
            background: #F57C00;
        }

        /* AI 助手区域样式 */
        .ai-assistant {
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f2f5 100%);
            border: 2px solid #b2dfdb;
            border-radius: 16px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #00796b;
        }
        
        .ai-refresh-btn {
            background-color: #26a69a;
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .ai-refresh-btn:hover {
            background-color: #00897b;
        }
        
        .ai-advice-content {
            background-color: #ffffffcc;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            color: #263238;
            line-height: 1.5;
            border-left: 5px solid #26a69a;
        }

        /* 搜索无结果提示 */
        .search-no-result {
            text-align: center;
            font-size: 18px;
            color: #999;
            margin: 24px 0;
        }

        .search-result-count {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <!-- 登录页面 -->
    <div id="pageLogin" class="page active">
        <div class="auth-container">
            <div class="auth-title">登录</div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="loginPhone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="auth-btn" onclick="login()">登录</button>
            <div class="auth-switch">
                还没有账号？<a onclick="showPage('pageRegister')">立即注册</a>
            </div>
        </div>
    </div>

    <!-- 注册页面 -->
    <div id="pageRegister" class="page">
        <div class="auth-container">
            <div class="auth-title">注册</div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="regPhone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请设置密码">
            </div>
            <div class="form-group">
                <label>您的称呼</label>
                <input type="text" id="regName" placeholder="请输入您的称呼">
            </div>
            <div class="form-group">
                <label>您的身份</label>
                <select id="regRelation">
                    <option value="elder">老年人（我自己买）</option>
                    <option value="child">子女（帮父母付）</option>
                </select>
            </div>
            <button class="auth-btn" onclick="register()">注册</button>
            <div class="auth-switch">
                已有账号？<a onclick="showPage('pageLogin')">返回登录</a>
            </div>
        </div>
    </div>

    <!-- 页面1：老年人首页 -->
    <div id="page1" class="page">
        <div class="user-info">您好，<span id="name"></span>！</div>
        <!-- 搜索框 -->
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索您想要的商品" onkeydown="if(event.key==='Enter')search()">
            <button class="search-btn" onclick="search()">搜索</button>
        </div>
        <div class="title">您想买点什么？</div>
        <!-- 推荐区 -->
        <div class="recommend-section" id="recommendSection">
            <div class="recommend-title">猜您喜欢 ❤️</div>
            <div class="recommend-list" id="recommendList"></div>
        </div>
        <div class="btn-group">
            <button class="btn food" onclick="go(2)">
                <img src="images/food.png" alt="食品饮料"/>
                食品饮料
            </button>
            <button class="btn daily" onclick="go(3)">
                <img src="images/daily.png" alt="日用品"/>
                日用品
            </button>
            <button class="btn medicine" onclick="go(4)">
                <img src="images/medicine.png" alt="药品保健"/>
                药品保健
            </button>
            <button class="btn look" onclick="go(5)">
                <img src="images/browse.png" alt="随便看看"/>
                随便看看
            </button>
        </div>
        <button class="btn cart" onclick="go(6)" style="width:100%;height:80px;font-size:22px;margin-top:14px;">
            <img src="images/cart.png" alt="购物车"/>
            我选好的东西
        </button>
        <button class="back" onclick="logout()" style="margin-top:24px;">退出登录</button>
    </div>

    <!-- 页面8：搜索结果 -->
    <div id="page8" class="page">
        <button class="back" onclick="go(1)">返回首页</button>
        <div class="title">搜索结果</div>
        <div class="search-result-count" id="searchResultCount"></div>
        <div class="goods-list" id="searchResultList"></div>
        <div class="search-no-result" id="searchNoResult" style="display:none;">没有找到相关商品，换一个关键词试试吧 🔍</div>
    </div>

    <!-- 页面7：子女首页 - 待代付订单 -->
    <div id="page7" class="page">
        <div class="user-info">您好，<span id="childUserName"></span>！（子女账号）</div>
        <div class="title">待代付订单</div>
        <div id="pendingOrdersList"></div>
        <button class="back" onclick="logout()" style="margin-top:24px;">退出登录</button>
    </div>

    <!-- 页面2：食品 -->
    <div id="page2" class="page">
        <button class="back" onclick="go(1)">返回首页</button>
        <div class="title">食品饮料</div>
        <div class="goods-list" id="foodList"></div>
    </div>

    <!-- 页面3：日用品 -->
    <div id="page3" class="page">
        <button class="back" onclick="go(1)">返回首页</button>
        <div class="title">日用品</div>
        <div class="goods-list" id="dailyList"></div>
    </div>

    <!-- 页面4：药品 -->
    <div id="page4" class="page">
        <button class="back" onclick="go(1)">返回首页</button>
        <div class="title">药品保健</div>
        <div class="goods-list" id="medicineList"></div>
    </div>

    <!-- 页面5：随便看看 -->
    <div id="page5" class="page">
        <button class="back" onclick="go(1)">返回首页</button>
        <div class="title">随便看看</div>
        <div class="goods-list" id="allList"></div>
    </div>

    <!-- 页面6：购物车 = 我选好的东西 -->
    <div id="page6" class="page">
        <button class="back" onclick="go(1)">返回首页</button>
        <div class="title">我选好的东西</div>
        <div id="cartList"></div>
        <div class="total">合计：¥<span id="total">0</span></div>
        <div class="ai-assistant">
            <div class="ai-header">
                <span>🤖 AI 导购助手</span>
                <button class="ai-refresh-btn" onclick="getAiShoppingAdvice()">✨ 获取购买建议</button>
            </div>
            <div class="ai-advice-content" id="aiAdviceContent">
                点击按钮，让AI帮你分析一下购物清单，看看有没有漏掉什么好东西！
            </div>
        </div>
        <button class="btn pay" onclick="pay()" style="width:100%;height:60px;font-size:20px">
            去结算（亲情代付）
        </button>
    </div>
</body>

<script>
    const API = 'http://localhost:3000';
    let currentUser = null; // { userId, name, relation }
    let cartItems = [];

    // ============ 页面切换 ============
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function go(num) {
        if (num === 1) {
            // 根据用户身份跳转到不同首页
            if (currentUser && currentUser.relation === 'child') {
                loadPendingOrders();
                showPage('page7');
            } else {
                if (currentUser) {
                    document.getElementById('name').textContent = currentUser.name || '';
                }
                showPage('page1');
                // 返回首页时刷新推荐
                if (currentUser) {
                    loadRecommendations();
                }
            }
        } else if (num === 2) {
            loadGoods('food', 'foodList');
            showPage('page2');
            trackBrowse('food');
        } else if (num === 3) {
            loadGoods('daily', 'dailyList');
            showPage('page3');
            trackBrowse('daily');
        } else if (num === 4) {
            loadGoods('medicine', 'medicineList');
            showPage('page4');
            trackBrowse('medicine');
        } else if (num === 5) {
            loadAllGoods();
            showPage('page5');
            trackBrowse(null); // 全部商品，不指定品类
        } else if (num === 6) {
            loadCart();
            showPage('page6');
        }
    }

    // ============ 用户认证 ============
    async function register() {
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const name = document.getElementById('regName').value.trim();
        const relation = document.getElementById('regRelation').value;

        if (!phone) { alert('请输入手机号'); return; }
        if (!password) { alert('请输入密码'); return; }

        try {
            const res = await fetch(`${API}/api/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password, name, relation })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            alert('注册成功！请登录');
            showPage('pageLogin');
        } catch (e) {
            alert('网络错误，请检查服务器是否运行');
        }
    }

    async function login() {
        const phone = document.getElementById('loginPhone').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        if (!phone) { alert('请输入手机号'); return; }
        if (!password) { alert('请输入密码'); return; }

        try {
            const res = await fetch(`${API}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            currentUser = { userId: data.userId, name: data.name, relation: data.relation };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            alert('登录成功！');
            go(1);
        } catch (e) {
            alert('网络错误，请检查服务器是否运行');
        }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('currentUser');
        cartItems = [];
        showPage('pageLogin');
    }

    // ============ 搜索功能 ============
    async function search() {
        const keyword = document.getElementById('searchInput').value.trim();
        if (!keyword) {
            alert('请输入搜索关键词');
            return;
        }

        // 记录搜索行为
        if (currentUser) {
            try {
                await fetch(`${API}/api/behavior/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.userId, keyword })
                });
            } catch (e) { /* 静默失败，不影响搜索 */ }
        }

        // 调用搜索接口
        try {
            const res = await fetch(`${API}/api/search?q=${encodeURIComponent(keyword)}`);
            const results = await res.json();
            renderSearchResults(keyword, results);
            showPage('page8');
        } catch (e) {
            alert('搜索失败，请检查服务器');
        }
    }

    function renderSearchResults(keyword, results) {
        const list = document.getElementById('searchResultList');
        const count = document.getElementById('searchResultCount');
        const noResult = document.getElementById('searchNoResult');

        if (results.length === 0) {
            count.textContent = '';
            list.innerHTML = '';
            noResult.style.display = 'block';
        } else {
            noResult.style.display = 'none';
            count.textContent = `找到 ${results.length} 个与"${keyword}"相关的商品`;
            list.innerHTML = '';
            results.forEach(g => {
                list.innerHTML += `
                    <div class="goods-item">
                        ${getEmojiHtml(g, 'goods-emoji')}
                        <div class="goods-name">${g.name}</div>
                        <div class="goods-desc">${g.description || ''}</div>
                        <div class="goods-price">¥${g.price.toFixed(1)}</div>
                        <button class="add" onclick="addCart(${g.id}, '${g.name}', ${g.price})">加入我选好的东西</button>
                    </div>
                `;
            });
        }
    }

    // ============ 推荐功能 ============
    async function loadRecommendations() {
        if (!currentUser) return;
        try {
            const res = await fetch(`${API}/api/recommendations/${currentUser.userId}`);
            const recommendations = await res.json();
            renderRecommendations(recommendations);
        } catch (e) {
            // 静默失败，不影响主流程
            document.getElementById('recommendSection').style.display = 'none';
        }
    }

    function renderRecommendations(items) {
        const section = document.getElementById('recommendSection');
        const list = document.getElementById('recommendList');

        if (!items || items.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        list.innerHTML = '';

        items.forEach(g => {
            const tagHtml = g.tags && g.tags.length > 0
                ? `<span class="recommend-tag">${g.tags[0]}</span>`
                : '';

            list.innerHTML += `
                <div class="recommend-item">
                    ${getEmojiHtml(g, 'recommend-emoji')}
                    <div class="recommend-name">${g.name}</div>
                    ${tagHtml}
                    <div class="recommend-price">¥${g.price.toFixed(1)}</div>
                    <button class="recommend-add" onclick="event.stopPropagation(); addCart(${g.id}, '${g.name.replace(/'/g, "\\'")}', ${g.price})">加入我选好的东西</button>
                </div>
            `;
        });
    }

    // ============ 行为追踪 ============
    async function trackBrowse(category, goodsId) {
        if (!currentUser) return;
        try {
            await fetch(`${API}/api/behavior/browse`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.userId,
                    category: category || undefined,
                    goodsId: goodsId || undefined
                })
            });
        } catch (e) { /* 静默失败 */ }
    }

    // 检查是否已登录
    function checkLogin() {
        const saved = localStorage.getItem('currentUser');
        if (saved) {
            currentUser = JSON.parse(saved);
            if (currentUser.relation === 'child') {
                document.getElementById('childUserName').textContent = currentUser.name || '';
            } else {
                document.getElementById('name').textContent = currentUser.name || '';
            }
        }
    }

    // ============ 商品 ============
    function getEmojiHtml(g, cssClass) {
        // 用 emoji 代替图片，图文对应
        if (g.emoji) {
            const catClass = 'emoji-' + (g.category || 'food');
            return `<div class="${cssClass} ${catClass}">${g.emoji}</div>`;
        }
        // 无 emoji 时使用原图片
        if (g.image) {
            return `<img src="${g.image}" alt="${g.name}" class="${cssClass}" onerror="this.style.display='none'"/>`;
        }
        return '';
    }

    async function loadGoods(category, containerId) {
        try {
            const res = await fetch(`${API}/api/goods/${category}`);
            const goods = await res.json();
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            goods.forEach(g => {
                container.innerHTML += `
                    <div class="goods-item">
                        ${getEmojiHtml(g, 'goods-emoji')}
                        <div class="goods-name">${g.name}</div>
                        <div class="goods-desc">${g.description || ''}</div>
                        <div class="goods-price">¥${g.price.toFixed(1)}</div>
                        <button class="add" onclick="addCart(${g.id}, '${g.name}', ${g.price})">加入我选好的东西</button>
                    </div>
                `;
            });
        } catch (e) {
            alert('加载商品失败，请检查服务器');
        }
    }

    async function loadAllGoods() {
        try {
            const res = await fetch(`${API}/api/goods`);
            const goods = await res.json();
            const container = document.getElementById('allList');
            container.innerHTML = '';
            goods.forEach(g => {
                container.innerHTML += `
                    <div class="goods-item">
                        ${getEmojiHtml(g, 'goods-emoji')}
                        <div class="goods-name">${g.name}</div>
                        <div class="goods-desc">${g.description || ''}</div>
                        <div class="goods-price">¥${g.price.toFixed(1)}</div>
                        <button class="add" onclick="addCart(${g.id}, '${g.name}', ${g.price})">加入我选好的东西</button>
                    </div>
                `;
            });
        } catch (e) {
            alert('加载商品失败，请检查服务器');
        }
    }

    // ============ 购物车 ============
    async function loadCart() {
        if (!currentUser) return;
        try {
            const res = await fetch(`${API}/api/cart/${currentUser.userId}`);
            cartItems = await res.json();
            renderCart();
        } catch (e) {
            alert('加载购物车失败');
        }
    }

    async function addCart(goodsId, name, price) {
        if (!confirm('确定要把 ' + name + ' 加入购物车吗？')) return;
        if (!currentUser) { alert('请先登录'); return; }
        try {
            const res = await fetch(`${API}/api/cart/${currentUser.userId}/items`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ goodsId, name, price })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            cartItems = data.items;
            alert('已加入购物车！');
        } catch (e) {
            alert('网络错误');
        }
    }

    async function removeCartItem(itemId) {
        if (!currentUser) return;
        try {
            const res = await fetch(`${API}/api/cart/${currentUser.userId}/items/${itemId}`, {
                method: 'DELETE'
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            cartItems = data.items;
            renderCart();
        } catch (e) {
            alert('网络错误');
        }
    }

    function renderCart() {
        const list = document.getElementById('cartList');
        list.innerHTML = '';
        let total = 0;
        cartItems.forEach(item => {
            total += item.price;
            list.innerHTML += `
                <div class="cart-item">
                    <span>${item.name}  ￥${item.price.toFixed(1)}</span>
                    <button class="cart-item-remove" onclick="removeCartItem('${item.id}')">删除</button>
                </div>
            `;
        });
        document.getElementById('total').textContent = total.toFixed(1);
    }

    // ============ 结算 ============
    async function pay() {
        if (cartItems.length === 0) {
            alert('您还没有选任何东西哦！');
            return;
        }
        if (!confirm('确定要提交订单，请子女代付吗？')) return;

        const total = cartItems.reduce((sum, item) => sum + item.price, 0);
        try {
            const res = await fetch(`${API}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.userId,
                    items: cartItems,
                    total
                })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            alert('订单已创建！订单号：' + data.order.id + '\n等待子女代付……');
            cartItems = [];
            renderCart();
            go(1);
        } catch (e) {
            alert('网络错误');
        }
    }

    // ========== 新增：AI 购物建议功能 ==========
    async function getAiShoppingAdvice() {
        // 1. 检查用户是否已登录
        if (!currentUser) {
            alert("请先登录后获取建议。");
            return;
        }

        // 2. 获取购物车内容
        const adviceContentDiv = document.getElementById('aiAdviceContent');
        if (!adviceContentDiv) return;

        // 显示加载状态
        adviceContentDiv.innerHTML = '<span style="color: #00796b;">🤔 AI 正在分析您的购物清单，请稍候...</span>';
    
        // 3. 获取最新购物车数据
        try {
            const cartRes = await fetch(`${API}/api/cart/${currentUser.userId}`);
            if (!cartRes.ok) {
                throw new Error("获取购物车失败");
            }
            const cartItems = await cartRes.json(); // 假设返回 [{id, name, price, ...}, ...]
            
            if (!cartItems || cartItems.length === 0) {
                adviceContentDiv.innerHTML = "您的购物车还是空的。先去逛逛，添加些心仪的商品再来找我咨询吧！🛒";
                return;
            }

            // 准备要发送给后端的商品列表，只提取 name 和 price
            const itemsForAI = cartItems.map(item => ({
                name: item.name,
                price: item.price
            }));
    
            // 4. 调用后端的新接口 /api/ai-advice
            const response = await fetch(`${API}/api/ai-advice`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ items: itemsForAI })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "获取建议失败");
            }

            // 5. 成功获取建议，显示在页面上
            if (data.success && data.advice) {
                adviceContentDiv.innerHTML = data.advice;
            } else {
                throw new Error("获取建议失败，请稍后重试");
            }
    
        } catch (error) {
            console.error('获取AI建议错误:', error);
            adviceContentDiv.innerHTML = `😵 获取建议失败：${error.message || "网络错误，请稍后重试"}`;
        }
    }


    // ============ 子女代付功能 ============
    async function loadPendingOrders() {
        try {
            const res = await fetch(`${API}/api/orders/pending`);
            const orders = await res.json();
            const container = document.getElementById('pendingOrdersList');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-tip">暂无待代付订单 ✨</div>';
                return;
            }

            orders.forEach(order => {
                const itemsHtml = order.items.map(item =>
                    `<div class="order-item-row">${item.name}  ￥${item.price.toFixed(1)}</div>`
                ).join('');

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-id">订单号：${order.id}</span>
                            <span class="order-status ${order.status}">${order.status === 'pending' ? '待代付' : '已代付'}</span>
                        </div>
                        <div class="order-items">${itemsHtml}</div>
                        <div class="order-total">合计：¥${order.total.toFixed(1)}</div>
                        ${order.status === 'pending'
                            ? `<button class="pay-btn" onclick="childPayOrder('${order.id}')">帮我代付 ¥${order.total.toFixed(1)}</button>`
                            : '<button class="pay-btn" disabled>已代付</button>'
                        }
                    </div>
                `;
            });
        } catch (e) {
            alert('加载订单失败，请检查服务器');
        }
    }

    async function childPayOrder(orderId) {
        if (!confirm('确认代付此订单吗？')) return;
        try {
            const res = await fetch(`${API}/api/orders/${orderId}/pay`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ payerId: currentUser.userId })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            alert('代付成功！🎉');
            loadPendingOrders();
        } catch (e) {
            alert('网络错误');
        }
    }

    // 初始化
    checkLogin();
    if (currentUser) {
        if (currentUser.relation === 'child') {
            document.getElementById('childUserName').textContent = currentUser.name || '';
            loadPendingOrders();
            showPage('page7');
        } else {
            document.getElementById('userName').textContent = currentUser.name || '';
            showPage('page1');
            loadRecommendations();
        }
    }
</script>
</html>
