<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>老年极简购物助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #FFF8F0;
            padding: 8px 6px;
            font-size: 15px;
            line-height: 1.4;
            max-width: 600px;
            margin: 0 auto;
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .title {
            font-size: 24px;
            text-align: center;
            margin: 12px 0 18px 0;
            font-weight: bold;
            color: #222222;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn {
            position: relative;
            height: 120px;
            font-size: 20px;
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        .btn img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .back {
            width: 100%;
            height: 48px;
            background: #8D6E63;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .back:hover {
            background: #6D4C41;
        }

        /* 暖色养老风格：米白 + 橙色 */
        .food {
            background: #FF8C42;
        }
        .daily {
            background: #FFA726;
        }
        .medicine {
            background: #FB8C00;
        }
        .look {
            background: #FFE0B2;
            color: #5D4037;
        }
        .cart {
            background: #FF8C42;
        }
        .pay {
            background: #E65100;
        }
        .add {
            background: #FF8C42;
            width: 100%;
            height: 48px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            color: white;
            margin: 8px 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add:hover {
            background: #F57C00;
        }

        .goods-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .goods-item {
            border: 2px solid #FFE0B2;
            border-radius: 12px;
            padding: 8px;
            background: #FFFDF9;
            box-shadow: 0 2px 6px rgba(255,140,66,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .goods-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(255,140,66,0.2);
        }

        .goods-image {
            width: 100%;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #f0f0f0;
        }

        .goods-emoji {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .emoji-food { background: #FFF3E0; }
        .emoji-daily { background: #E8F5E9; }
        .emoji-medicine { background: #F3E5F5; }

        .goods-name {
            font-size: 14px;
            font-weight: bold;
            color: #222222;
            text-align: center;
        }

        .goods-desc {
            font-size: 11px;
            color: #666;
            margin: 3px 0;
            text-align: center;
        }

        .goods-price {
            color: #E65100;
            font-size: 16px;
            font-weight: bold;
            margin: 6px 0;
        }

        .cart-item {
            padding: 8px;
            border: 2px solid #FFE0B2;
            border-radius: 10px;
            margin: 8px 0;
            font-size: 14px;
            background: #FFFDF9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-remove {
            background: #E65100;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #E65100;
            margin: 12px 0;
        }

        /* 登录/注册页面样式 */
        .auth-container {
            max-width: 360px;
            margin: 20px auto;
            background: #FFFDF9;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 12px rgba(255,140,66,0.12);
        }

        .auth-title {
            font-size: 24px;
            text-align: center;
            margin-bottom: 18px;
            color: #222;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            height: 42px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 0 12px;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #FF8C42;
        }

        .auth-btn {
            width: 100%;
            height: 46px;
            font-size: 18px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background: #F57C00;
        }

        .auth-switch {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }

        .auth-switch a {
            color: #FF8C42;
            cursor: pointer;
            text-decoration: underline;
        }

        .user-info {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .hidden {
            display: none !important;
        }

        /* 子女代付页面样式 */
        .order-card {
            border: 2px solid #FFE0B2;
            border-radius: 14px;
            padding: 12px;
            background: #FFFDF9;
            box-shadow: 0 2px 6px rgba(255,140,66,0.1);
            margin-bottom: 14px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-id {
            font-size: 12px;
            color: #666;
        }

        .order-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .order-status.pending {
            background: #FFF3E0;
            color: #F7931E;
        }

        .order-status.paid {
            background: #E8F5E9;
            color: #58B352;
        }

        .order-items {
            font-size: 13px;
            margin: 8px 0;
        }

        .order-item-row {
            padding: 4px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-total {
            font-size: 18px;
            font-weight: bold;
            color: #E65100;
            text-align: right;
            margin: 10px 0;
        }

        .pay-btn {
            width: 100%;
            height: 46px;
            font-size: 18px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .pay-btn:hover {
            background: #F57C00;
        }

        .pay-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .empty-tip {
            text-align: center;
            font-size: 18px;
            color: #999;
            margin: 24px 0;
        }

        /* 搜索框样式 */
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            height: 48px;
            font-size: 18px;
            border: 3px solid #FFE0B2;
            border-radius: 14px;
            padding: 0 16px;
            background: #FFFDF9;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #FF8C42;
        }

        .search-input::placeholder {
            color: #bbb;
            font-size: 16px;
        }

        .search-btn {
            width: 80px;
            height: 48px;
            font-size: 18px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: #F57C00;
        }

        /* 推荐区样式 */
        .recommend-section {
            margin-top: 18px;
            margin-bottom: 18px;
        }

        .recommend-title {
            font-size: 22px;
            font-weight: bold;
            color: #E65100;
            text-align: center;
            margin-bottom: 12px;
        }

        .recommend-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .recommend-item {
            border: 2px solid #FFCC80;
            border-radius: 14px;
            padding: 10px;
            background: linear-gradient(135deg, #FFFDF9, #FFF8F0);
            box-shadow: 0 2px 8px rgba(255,140,66,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .recommend-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,140,66,0.2);
        }

        .recommend-image {
            width: 100%;
            height: 72px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 6px;
            background: #f0f0f0;
        }

        .recommend-emoji {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .recommend-name {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        .recommend-tag {
            font-size: 11px;
            color: #FF8C42;
            background: #FFF3E0;
            padding: 2px 8px;
            border-radius: 6px;
            margin: 4px 0;
        }

        .recommend-price {
            font-size: 17px;
            font-weight: bold;
            color: #E65100;
            margin: 4px 0;
        }

        .recommend-add {
            width: 100%;
            height: 38px;
            font-size: 14px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .recommend-add:hover {
            background: #F57C00;
        }

        /* AI 助手区域样式 */
        .ai-assistant {
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f2f5 100%);
            border: 2px solid #b2dfdb;
            border-radius: 16px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #00796b;
        }
        
        .ai-refresh-btn {
            background-color: #26a69a;
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .ai-refresh-btn:hover {
            background-color: #00897b;
        }
        
        .ai-advice-content {
            background-color: #ffffffcc;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            color: #263238;
            line-height: 1.5;
            border-left: 5px solid #26a69a;
        }

        /* 搜索无结果提示 */
        .search-no-result {
            text-align: center;
            font-size: 18px;
            color: #999;
            margin: 24px 0;
        }

        .search-result-count {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-bottom: 12px;
        }

        /* ===== 全场景 AI 浮动按钮 ===== */
        .ai-float-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #26a69a, #00897b);
            color: white;
            font-size: 28px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,137,123,0.4);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: aiFloatPulse 2s infinite;
        }

        .ai-float-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(0,137,123,0.5);
        }

        @keyframes aiFloatPulse {
            0%, 100% { box-shadow: 0 4px 16px rgba(0,137,123,0.4); }
            50% { box-shadow: 0 4px 24px rgba(0,137,123,0.6); }
        }

        /* ===== AI 聊天弹窗 ===== */
        .ai-chat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .ai-chat-overlay.active {
            display: flex;
        }

        .ai-chat-box {
            width: 90%;
            max-width: 420px;
            max-height: 80vh;
            background: #FFFDF9;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .ai-chat-header {
            background: linear-gradient(135deg, #26a69a, #00897b);
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-chat-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .ai-chat-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        .ai-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            min-height: 200px;
            max-height: 400px;
        }

        .ai-msg {
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
        }

        .ai-msg.bot {
            justify-content: flex-start;
        }

        .ai-msg.user {
            justify-content: flex-end;
        }

        .ai-msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.5;
        }

        .ai-msg.bot .ai-msg-bubble {
            background: #E0F2F1;
            color: #004D40;
            border-bottom-left-radius: 4px;
        }

        .ai-msg.user .ai-msg-bubble {
            background: #FF8C42;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-chat-input-area {
            padding: 12px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
        }

        .ai-chat-input {
            flex: 1;
            height: 44px;
            border: 2px solid #ddd;
            border-radius: 22px;
            padding: 0 16px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .ai-chat-input:focus {
            border-color: #26a69a;
        }

        .ai-chat-send {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #26a69a;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .ai-chat-send:hover {
            background: #00897b;
        }

        .ai-chat-send:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 麦克风按钮 */
        .ai-chat-mic {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #FF8C42;
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .ai-chat-mic:hover {
            background: #F57C00;
        }

        .ai-chat-mic.recording {
            background: #E53935;
            animation: micPulse 1s infinite;
        }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* 语音播放按钮（在AI消息气泡旁） */
        .ai-msg-speak-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .ai-msg-speak-btn:hover {
            background: rgba(0,0,0,0.08);
        }

        .ai-msg-bubble-content {
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        /* 子分类选择器 */
        .subcat-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }

        .subcat-btn {
            padding: 10px 18px;
            font-size: 16px;
            border: 2px solid #FFE0B2;
            border-radius: 24px;
            background: #FFFDF9;
            color: #5D4037;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }

        .subcat-btn:hover {
            background: #FFF3E0;
            border-color: #FF8C42;
        }

        .subcat-btn.active {
            background: #FF8C42;
            color: white;
            border-color: #FF8C42;
        }

        .subcat-btn.all {
            background: #FFE0B2;
            border-color: #FFE0B2;
        }

        /* 商品详情页 */
        .detail-container {
            background: #FFFDF9;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(255,140,66,0.12);
        }

        .detail-emoji {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .detail-name {
            font-size: 26px;
            font-weight: bold;
            color: #222;
            text-align: center;
            margin-bottom: 8px;
        }

        .detail-price {
            font-size: 28px;
            font-weight: bold;
            color: #E65100;
            text-align: center;
            margin-bottom: 16px;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
        }

        .detail-tag {
            font-size: 14px;
            color: #FF8C42;
            background: #FFF3E0;
            padding: 4px 12px;
            border-radius: 14px;
        }

        .detail-desc {
            font-size: 16px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 20px;
            padding: 12px;
            background: #FFF8F0;
            border-radius: 10px;
        }

        .detail-desc-title {
            font-size: 18px;
            font-weight: bold;
            color: #5D4037;
            margin-bottom: 8px;
        }

        .detail-add-btn {
            width: 100%;
            height: 56px;
            font-size: 20px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .detail-add-btn:hover {
            background: #F57C00;
        }
    </style>
</head>

<body>
    <!-- 身份选择页面（入口） -->
    <div id="pageRoleSelect" class="page active">
        <div class="auth-container" style="max-width:420px;">
            <div class="auth-title">您好！请选择您的身份</div>
            <div class="btn-group">
                <button class="btn food" onclick="selectRole('elder')" style="height:100px;">
                    👴 我是老人
                </button>
                <button class="btn daily" onclick="selectRole('child')" style="height:100px;">
                    👨 我是子女
                </button>
            </div>
        </div>
    </div>

    <!-- 登录页面 -->
    <div id="pageLogin" class="page">
        <div class="auth-container">
            <div class="auth-title" id="loginTitle">登录</div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="loginPhone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="auth-btn" onclick="login()">登录</button>
            <div class="auth-switch">

<script>
    const API = 'http://localhost:3000';
    let currentUser = null; // { userId, name, relation }
    let cartItems = [];
    let selectedRole = null; // 当前选择的身份：'elder' 或 'child'
    let lastPage = null; // 记录进入详情页之前的页面，用于返回
    let currentCategory = null; // 当前浏览的大分类
    let currentSubcategory = 'all'; // 当前选中的子分类

    // ============ 页面切换 ============
    const AI_PAGES = ['page1', 'page2', 'page3', 'page4', 'page5', 'page6', 'page8', 'page9', 'page10']; // 显示AI按钮的页面

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');

        // 控制 AI 浮动按钮显示/隐藏
        const floatBtn = document.getElementById('aiFloatBtn');
        if (floatBtn) {
            if (AI_PAGES.includes(pageId) && currentUser && currentUser.relation !== 'child') {
                floatBtn.style.display = 'flex';
            } else {
                floatBtn.style.display = 'none';
            }
        }
    }

    function go(num) {
        if (num === 1) {
            // 根据用户身份跳转到不同首页
            if (currentUser && currentUser.relation === 'child') {
                document.getElementById('childUserName').textContent = currentUser.name || '';
                loadPendingOrders();
                showChildTab('pending');
                showPage('page7');
            } else {
                if (currentUser) {
                    document.getElementById('name').textContent = currentUser.name || '';
                }
                showPage('page1');
            }
        } else if (num === 2) {
            currentCategory = 'food';
            currentSubcategory = 'all';
            resetSubcatButtons('foodSubcatBar');
            loadGoodsBySubcat('food', 'all', 'foodList');
            showPage('page2');
            trackBrowse('food');
        } else if (num === 3) {
            currentCategory = 'daily';
            currentSubcategory = 'all';
            resetSubcatButtons('dailySubcatBar');
            loadGoodsBySubcat('daily', 'all', 'dailyList');
            showPage('page3');
            trackBrowse('daily');
        } else if (num === 4) {
            currentCategory = 'medicine';
            currentSubcategory = 'all';
            resetSubcatButtons('medicineSubcatBar');
            loadGoodsBySubcat('medicine', 'all', 'medicineList');
            showPage('page4');
            trackBrowse('medicine');
        } else if (num === 5) {
            loadAllGoods();
            showPage('page5');
            trackBrowse(null); // 全部商品，不指定品类
            // 随便看看时加载推荐
            if (currentUser) {
                loadRecommendations();
            }
        } else if (num === 6) {
            loadCart();
            showPage('page6');
        } else if (num === 9) {
            loadMyOrders();
            showPage('page9');
        }
    }

    // ============ 身份选择 ============
    function selectRole(role) {
        selectedRole = role;
        const roleLabel = role === 'elder' ? '👴 老人' : '👨 子女';

        // 更新登录页面标题
        const loginTitle = document.getElementById('loginTitle');
        if (loginTitle) loginTitle.textContent = `${roleLabel}登录`;

        // 更新注册页面标题和显示
        const registerTitle = document.getElementById('registerTitle');
        if (registerTitle) registerTitle.textContent = `${roleLabel}注册`;

        // 子女注册时显示父母手机号输入框
        const childExtra = document.getElementById('childRegExtra');
        if (childExtra) {
            childExtra.classList.toggle('hidden', role !== 'child');
        }

        showPage('pageLogin');
    }

    // ============ 用户认证 ============
    async function register() {
        if (!selectedRole) { alert('请先选择身份'); return; }

        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const name = document.getElementById('regName').value.trim();
        const parentPhone = document.getElementById('regParentPhone').value.trim();

        if (!phone) { alert('请输入手机号'); return; }
        if (!password) { alert('请输入密码'); return; }
        if (!name) { alert('请输入您的称呼'); return; }
        if (selectedRole === 'child' && !parentPhone) { alert('请输入父母手机号以完成绑定'); return; }

        try {
            const res = await fetch(`${API}/api/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone, password, name,
                    relation: selectedRole,
                    parentPhone: selectedRole === 'child' ? parentPhone : undefined
                })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            alert('注册成功！请登录');
            showPage('pageLogin');
        } catch (e) {
            alert('网络错误，请检查服务器是否运行');
        }
    }

    async function login() {
        if (!selectedRole) { alert('请先选择身份'); return; }

        const phone = document.getElementById('loginPhone').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        if (!phone) { alert('请输入手机号'); return; }
        if (!password) { alert('请输入密码'); return; }

        try {
            const res = await fetch(`${API}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }

            // 验证身份是否匹配
            if (data.relation && data.relation !== selectedRole) {
                alert('该账号的身份与当前选择的身份不一致，请重新选择身份');
                showPage('pageRoleSelect');
                return;
            }

            currentUser = { userId: data.userId, name: data.name, relation: data.relation, parentId: data.parentId || null };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            alert('登录成功！');
            go(1);
        } catch (e) {
            alert('网络错误，请检查服务器是否运行');
        }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('currentUser');
        cartItems = [];
        selectedRole = null;
        // 清空输入框
        document.getElementById('loginPhone').value = '';
        document.getElementById('loginPassword').value = '';
        document.getElementById('regPhone').value = '';
        document.getElementById('regPassword').value = '';
        document.getElementById('regName').value = '';
        document.getElementById('regParentPhone').value = '';
        showPage('pageRoleSelect');
    }

    // ============ 搜索功能 ============
    async function search() {
        const keyword = document.getElementById('searchInput').value.trim();
        if (!keyword) {
            alert('请输入搜索关键词');
            return;
        }

        // 记录搜索行为
        if (currentUser) {
            try {
                await fetch(`${API}/api/behavior/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.userId, keyword })
                });
            } catch (e) { /* 静默失败，不影响搜索 */ }
        }

        // 调用搜索接口
        try {
            const res = await fetch(`${API}/api/search?q=${encodeURIComponent(keyword)}`);
            const results = await res.json();
            renderSearchResults(keyword, results);
            showPage('page8');
        } catch (e) {
            alert('搜索失败，请检查服务器');
        }
    }

    function renderSearchResults(keyword, results) {
        const list = document.getElementById('searchResultList');
        const count = document.getElementById('searchResultCount');
        const noResult = document.getElementById('searchNoResult');

        if (results.length === 0) {
            count.textContent = '';
            list.innerHTML = '';
            noResult.style.display = 'block';
        } else {
            noResult.style.display = 'none';
            count.textContent = `找到 ${results.length} 个与"${keyword}"相关的商品`;
            list.innerHTML = '';
            results.forEach(g => {
                list.innerHTML += `
                    <div class="goods-item" onclick="showDetail(${g.id})">
                        ${getEmojiHtml(g, 'goods-emoji')}
                        <div class="goods-name">${g.name}</div>
                        <div class="goods-desc">${g.description || ''}</div>
                        <div class="goods-price">¥${g.price.toFixed(1)}</div>
                        <button class="add" onclick="event.stopPropagation(); addCart(${g.id}, '${g.name}', ${g.price})">加入我选好的东西</button>
                    </div>
                `;
            });
        }
    }

    // ============ 推荐功能 ============
    async function loadRecommendations() {
        if (!currentUser) return;
        try {
            const res = await fetch(`${API}/api/recommendations/${currentUser.userId}`);
            const recommendations = await res.json();
            renderRecommendations(recommendations);
        } catch (e) {
            // 静默失败，不影响主流程
            const section = document.getElementById('recommendSection');
            if (section) section.style.display = 'none';
        }
    }

    function renderRecommendations(items) {
        const section = document.getElementById('recommendSection');
        const list = document.getElementById('recommendList');

        if (!items || items.length === 0) {
            if (section) section.style.display = 'none';
            return;
        }

        if (section) section.style.display = 'block';
        if (list) list.innerHTML = '';

        items.forEach(g => {
            const tagHtml = g.tags && g.tags.length > 0
                ? `<span class="recommend-tag">${g.tags[0]}</span>`
                : '';

            list.innerHTML += `
                <div class="recommend-item" onclick="showDetail(${g.id})">
                    ${getEmojiHtml(g, 'recommend-emoji')}
                    <div class="recommend-name">${g.name}</div>
                    ${tagHtml}
                    <div class="recommend-price">¥${g.price.toFixed(1)}</div>
                    <button class="recommend-add" onclick="event.stopPropagation(); addCart(${g.id}, '${g.name.replace(/'/g, "\\'")}', ${g.price})">加入我选好的东西</button>
                </div>
            `;
        });
    }

    // ============ 行为追踪 ============
    async function trackBrowse(category, goodsId) {
        if (!currentUser) return;
        try {
            await fetch(`${API}/api/behavior/browse`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.userId,
                    category: category || undefined,
                    goodsId: goodsId || undefined
                })
            });
        } catch (e) { /* 静默失败 */ }
    }

    // ============ 子分类筛选 ============
    function filterSubcat(category, subcategory) {
        currentSubcategory = subcategory;
        // 更新按钮状态
        const barId = category === 'food' ? 'foodSubcatBar' : category === 'daily' ? 'dailySubcatBar' : 'medicineSubcatBar';
        const bar = document.getElementById(barId);
        bar.querySelectorAll('.subcat-btn').forEach(btn => btn.classList.remove('active'));
        // 找到对应按钮并激活
        const buttons = bar.querySelectorAll('.subcat-btn');
        buttons.forEach(btn => {
            if ((subcategory === 'all' && btn.classList.contains('all')) ||
                btn.textContent.includes(subcategory)) {
                btn.classList.add('active');
            }
        });

        const containerId = category === 'food' ? 'foodList' : category === 'daily' ? 'dailyList' : 'medicineList';
        loadGoodsBySubcat(category, subcategory, containerId);
    }

    function resetSubcatButtons(barId) {
        const bar = document.getElementById(barId);
        bar.querySelectorAll('.subcat-btn').forEach(btn => btn.classList.remove('active'));
        const allBtn = bar.querySelector('.subcat-btn.all');
        if (allBtn) allBtn.classList.add('active');
    }

    async function loadGoodsBySubcat(category, subcategory, containerId) {
        try {
            const res = await fetch(`${API}/api/goods/${category}`);
            let goods = await res.json();
            // 按子分类筛选
            if (subcategory && subcategory !== 'all') {
                goods = goods.filter(g => g.subcategory === subcategory);
            }
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (goods.length === 0) {
                container.innerHTML = '<div class="empty-tip">该分类暂无商品</div>';
                return;
            }
            goods.forEach(g => {
                container.innerHTML += `
                    <div class="goods-item" onclick="showDetail(${g.id})">
                        ${getEmojiHtml(g, 'goods-emoji')}
                        <div class="goods-name">${g.name}</div>
                        <div class="goods-desc">${g.description || ''}</div>
                        <div class="goods-price">¥${g.price.toFixed(1)}</div>
                        <button class="add" onclick="event.stopPropagation(); addCart(${g.id}, '${g.name}', ${g.price})">加入我选好的东西</button>
                    </div>
                `;
            });

    // ============ 语音交互功能 ============
    // 使用浏览器 Web Speech API 实现实时语音转文字（类似微信语音输入）
    let recognition = null;
    let isRecording = false;
    let currentAudioElement = null; // 当前正在播放的语音
    let finalTranscript = ''; // 最终识别结果

    // 初始化语音识别
    function initSpeechRecognition() {
        // 兼容不同浏览器
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            console.error('浏览器不支持 Web Speech API');
            return null;
        }

        const rec = new SpeechRecognition();
        rec.lang = 'zh-CN';       // 中文
        rec.interimResults = true; // 开启实时结果
        rec.continuous = true;     // 连续识别

        rec.onresult = (event) => {
            const input = document.getElementById('aiChatInput');
            let interimTranscript = '';
            finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += transcript;
                } else {
                    interimTranscript += transcript;
                }
            }

            // 实时显示：最终结果 + 正在识别的结果
            const displayText = finalTranscript + interimTranscript;
            input.value = displayText;
            input.placeholder = interimTranscript ? '🎙 正在识别...' : '问我任何购物问题...';
        };

        rec.onerror = (event) => {
            console.error('语音识别错误:', event.error);
            if (event.error === 'not-allowed') {
                alert('无法获取麦克风权限，请确保浏览器允许访问麦克风');
            }
            stopRecording();
        };

        rec.onend = () => {
            // 如果还在录音状态，重新启动（保持连续识别）
            if (isRecording) {
                try {
                    rec.start();
                } catch (e) {
                    stopRecording();
                }
            } else {
                // 录音结束，如果有识别结果则自动发送
                if (finalTranscript.trim()) {
                    const input = document.getElementById('aiChatInput');
                    input.value = finalTranscript.trim();
                    input.placeholder = '问我任何购物问题...';
                    sendAiMessage();
                }
            }
        };

        return rec;
    }

    // 切换录音状态
    function toggleVoiceRecord() {
        const micBtn = document.getElementById('aiChatMicBtn');

        if (!isRecording) {
            // 开始录音
            if (!recognition) {
                recognition = initSpeechRecognition();
            }

            if (!recognition) {
                alert('您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器');
                return;
            }

            finalTranscript = '';
            const input = document.getElementById('aiChatInput');
            input.value = '';
            input.placeholder = '🎙 请说话...';

            try {
                recognition.start();
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.innerHTML = '⏹';
                micBtn.title = '停止录音';
            } catch (err) {
                console.error('启动语音识别失败:', err);
            }
        } else {
            // 停止录音
            stopRecording();
        }
    }

    // 停止录音
    function stopRecording() {
        const micBtn = document.getElementById('aiChatMicBtn');

        if (recognition && isRecording) {
            recognition.stop();
        }

        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.innerHTML = '🎤';
        micBtn.title = '语音输入';

        const input = document.getElementById('aiChatInput');
        input.placeholder = '问我任何购物问题...';
    }

    // 语音合成：将 AI 回复文字转为语音播放
    async function speakText(text) {
        // 如果已有语音在播放，先停止
        if (currentAudioElement) {
            currentAudioElement.pause();
            currentAudioElement = null;
        }

        try {
            const res = await fetch(`${API}/api/speech/tts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });

            if (res.ok) {
                const audioBlob = await res.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                currentAudioElement = new Audio(audioUrl);
                currentAudioElement.play();
                currentAudioElement.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    currentAudioElement = null;
                };
            } else {
                console.error('语音合成失败');
                // Fallback: 使用浏览器内置 TTS
                speakWithBrowserTTS(text);
            }
        } catch (e) {
            console.error('语音合成错误:', e);
            // Fallback: 使用浏览器内置 TTS
            speakWithBrowserTTS(text);
        }
    }

    // 浏览器内置 TTS 作为后备方案
    function speakWithBrowserTTS(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // 停止之前的
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9; // 稍慢，适合老年人
            utterance.pitch = 1;
            window.speechSynthesis.speak(utterance);
        }
    }

    // 发送欢迎消息
    async function sendAiWelcome() {
        try {
            const res = await fetch(`${API}/api/ai-advice`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    context: { scene: currentScene, goodsList: currentGoodsList }
                })
            });
            const data = await res.json();

            // 移除加载提示
            const messagesDiv = document.getElementById('aiChatMessages');
            if (messagesDiv.lastChild) messagesDiv.lastChild.remove();

            if (res.ok && data.success) {
                addChatMessage('bot', data.advice);
                aiChatHistory.push({ role: 'bot', content: data.advice });
            } else {
                console.error('AI 欢迎语失败:', data);
                addChatMessage('bot', '您好！我是您的AI购物助手 🛒\n\n商店有食品饮料、日用品、药品保健三大类商品，欢迎来逛逛！有什么想了解的，随时问我哦~');
            }
        } catch (e) {
            console.error('AI 欢迎语网络错误:', e);
            // 网络失败时的 fallback
            const messagesDiv = document.getElementById('aiChatMessages');
            if (messagesDiv.lastChild) messagesDiv.lastChild.remove();
            addChatMessage('bot', '您好！我是您的AI购物助手 🛒\n\n商店有食品饮料、日用品、药品保健三大类商品，欢迎来逛逛！有什么想了解的，随时问我哦~');
        } finally {
            aiWelcomeLoading = false;
        }
    }

    // 发送用户消息
    async function sendAiMessage() {
        const input = document.getElementById('aiChatInput');
        const question = input.value.trim();
        if (!question) return;

        // 显示用户消息
        addChatMessage('user', question);
        aiChatHistory.push({ role: 'user', content: question });
        input.value = '';

        // 禁用发送按钮，显示加载
        const sendBtn = document.getElementById('aiChatSendBtn');
        sendBtn.disabled = true;

        // 显示"AI正在思考"
        const loadingId = addChatMessage('bot', '🤔 正在思考...');

        try {
            // 获取当前购物车
            let items = [];
            try {
                const cartRes = await fetch(`${API}/api/cart/${currentUser.userId}`);
                if (cartRes.ok) {
                    items = (await cartRes.json()).map(i => ({ name: i.name, price: i.price }));
                }
            } catch (e) {}

            const res = await fetch(`${API}/api/ai-advice`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question,
                    items,
                    context: { scene: currentScene, goodsList: currentGoodsList }
                })
            });

            const data = await res.json();

            // 移除加载提示
            const messagesDiv = document.getElementById('aiChatMessages');
            messagesDiv.lastChild.remove();

            if (data.success) {
                addChatMessage('bot', data.advice);
                aiChatHistory.push({ role: 'bot', content: data.advice });
            } else {
                addChatMessage('bot', '抱歉，我暂时无法回答，请稍后再试。');
            }
        } catch (e) {
            const messagesDiv = document.getElementById('aiChatMessages');
            messagesDiv.lastChild.remove();
            addChatMessage('bot', '网络错误，请稍后再试。');
        } finally {
            sendBtn.disabled = false;
        }
    }

    // 重写 loadGoods 和 loadAllGoods 以记录当前商品列表
    const originalLoadGoods = loadGoods;
    loadGoods = async function(category, containerId) {
        await originalLoadGoods(category, containerId);
        try {
            const res = await fetch(`${API}/api/goods/${category}`);
            currentGoodsList = await res.json();
        } catch (e) {}
    };

    const originalLoadAllGoods = loadAllGoods;
    loadAllGoods = async function() {
        await originalLoadAllGoods();
        try {
            const res = await fetch(`${API}/api/goods`);
            currentGoodsList = await res.json();
        } catch (e) {}
    };

    // ============ 初始化 ============
    checkLogin();
    if (currentUser) {
        // 已登录：直接进入对应首页
        selectedRole = currentUser.relation;
        if (currentUser.relation === 'child') {
            document.getElementById('childUserName').textContent = currentUser.name || '';
            loadPendingOrders();
            showChildTab('pending');
            showPage('page7');
        } else {
            document.getElementById('name').textContent = currentUser.name || '';
            showPage('page1');
        }
    }
    // 未登录：默认显示身份选择页面（pageRoleSelect 已在 HTML 中设为 active）
</script>
