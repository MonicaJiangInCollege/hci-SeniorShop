<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>老年极简购物助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        html {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background: #FFF8F0;
            padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom) 8px;
            font-size: 20px;
            line-height: 1.5;
            max-width: 100%;
            margin: 0 auto;
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-text-size-adjust: 100%;
        }

        @media (min-width: 400px) {
            body {
                max-width: 420px;
            }
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .title {
            font-size: 32px;
            text-align: center;
            margin: 12px 0 18px 0;
            font-weight: bold;
            color: #222222;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn {
            position: relative;
            height: 120px;
            font-size: 24px;
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        .btn img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .back {
            width: 100%;
            height: 56px;
            background: #8D6E63;
            color: white;
            font-size: 22px;
            border: none;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .back:hover {
            background: #6D4C41;
        }

        /* 暖色养老风格：米白 + 橙色 */
        .food {
            background: #FF8C42;
        }
        .daily {
            background: #FFA726;
        }
        .medicine {
            background: #FB8C00;
        }
        .look {
            background: #FFE0B2;
            color: #5D4037;
        }
        .cart {
            background: #FF8C42;
        }
        .pay {
            background: #E65100;
        }
        .add {
            background: #FF8C42;
            width: 100%;
            height: 56px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            color: white;
            margin: 8px 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add:hover {
            background: #F57C00;
        }

        .goods-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .goods-item {
            border: 2px solid #FFE0B2;
            border-radius: 12px;
            padding: 8px;
            background: #FFFDF9;
            box-shadow: 0 2px 6px rgba(255,140,66,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .goods-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(255,140,66,0.2);
        }

        .goods-image {
            width: 100%;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #f0f0f0;
        }

        .goods-emoji {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .emoji-food { background: #FFF3E0; }
        .emoji-daily { background: #E8F5E9; }
        .emoji-medicine { background: #F3E5F5; }

        .goods-name {
            font-size: 18px;
            font-weight: bold;
            color: #222222;
            text-align: center;
        }

        .goods-desc {
            font-size: 15px;
            color: #666;
            margin: 3px 0;
            text-align: center;
        }

        .goods-price {
            color: #E65100;
            font-size: 22px;
            font-weight: bold;
            margin: 6px 0;
        }

        .cart-item {
            padding: 12px;
            border: 2px solid #FFE0B2;
            border-radius: 10px;
            margin: 8px 0;
            font-size: 18px;
            background: #FFFDF9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-remove {
            background: #E65100;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .total {
            text-align: right;
            font-size: 26px;
            font-weight: bold;
            color: #E65100;
            margin: 12px 0;
        }

        /* 登录/注册页面样式 */
        .auth-container {
            max-width: 360px;
            margin: 20px auto;
            background: #FFFDF9;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 12px rgba(255,140,66,0.12);
        }

        .auth-title {
            font-size: 30px;
            text-align: center;
            margin-bottom: 18px;
            color: #222;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            height: 50px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 0 12px;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #FF8C42;
        }

        .auth-btn {
            width: 100%;
            height: 56px;
            font-size: 22px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background: #F57C00;
        }

        .auth-switch {
            text-align: center;
            margin-top: 12px;
            font-size: 16px;
            color: #666;
        }

        .auth-switch a {
            color: #FF8C42;
            cursor: pointer;
            text-decoration: underline;
        }

        .user-info {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-bottom: 8px;
        }

        .hidden {
            display: none !important;
        }

        /* 子女帮付页面样式 */
        .order-card {
            border: 2px solid #FFE0B2;
            border-radius: 14px;
            padding: 12px;
            background: #FFFDF9;
            box-shadow: 0 2px 6px rgba(255,140,66,0.1);
            margin-bottom: 14px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-id {
            font-size: 12px;
            color: #666;
        }

        .order-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .order-status.pending {
            background: #FFF3E0;
            color: #F7931E;
        }

        .order-status.paid {
            background: #E8F5E9;
            color: #58B352;
        }

        .order-items {
            font-size: 13px;
            margin: 8px 0;
        }

        .order-item-row {
            padding: 4px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-total {
            font-size: 18px;
            font-weight: bold;
            color: #E65100;
            text-align: right;
            margin: 10px 0;
        }

        .pay-btn {
            width: 100%;
            height: 46px;
            font-size: 18px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .pay-btn:hover {
            background: #F57C00;
        }

        .pay-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .empty-tip {
            text-align: center;
            font-size: 18px;
            color: #999;
            margin: 24px 0;
        }

        /* 找找框样式 */
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            height: 56px;
            font-size: 22px;
            border: 3px solid #FFE0B2;
            border-radius: 14px;
            padding: 0 16px;
            background: #FFFDF9;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #FF8C42;
        }

        .search-input::placeholder {
            color: #bbb;
            font-size: 16px;
        }

        .search-btn {
            width: 90px;
            height: 56px;
            font-size: 22px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: #F57C00;
        }

        /* 推荐区样式 */
        .recommend-section {
            margin-top: 18px;
            margin-bottom: 18px;
        }

        .recommend-title {
            font-size: 22px;
            font-weight: bold;
            color: #E65100;
            text-align: center;
            margin-bottom: 12px;
        }

        .recommend-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .recommend-item {
            border: 2px solid #FFCC80;
            border-radius: 14px;
            padding: 10px;
            background: linear-gradient(135deg, #FFFDF9, #FFF8F0);
            box-shadow: 0 2px 8px rgba(255,140,66,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .recommend-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,140,66,0.2);
        }

        .recommend-image {
            width: 100%;
            height: 72px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 6px;
            background: #f0f0f0;
        }

        .recommend-emoji {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .recommend-name {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        .recommend-tag {
            font-size: 11px;
            color: #FF8C42;
            background: #FFF3E0;
            padding: 2px 8px;
            border-radius: 6px;
            margin: 4px 0;
        }

        .recommend-price {
            font-size: 17px;
            font-weight: bold;
            color: #E65100;
            margin: 4px 0;
        }

        .recommend-add {
            width: 100%;
            height: 38px;
            font-size: 14px;
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .recommend-add:hover {
            background: #F57C00;
        }

        /* AI 助手区域样式 */
        .ai-assistant {
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f2f5 100%);
            border: 2px solid #b2dfdb;
            border-radius: 16px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #00796b;
        }
        
        .ai-refresh-btn {
            background-color: #26a69a;
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .ai-refresh-btn:hover {
            background-color: #00897b;
        }
        
        .ai-advice-content {
            background-color: #ffffffcc;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            color: #263238;
            line-height: 1.5;
            border-left: 5px solid #26a69a;
        }

        /* 没找到结果提示 */
        .search-no-result {
            text-align: center;
            font-size: 18px;
            color: #999;
            margin: 24px 0;
        }

        .search-result-count {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-bottom: 12px;
        }

        /* ===== 全场景 AI 浮动按钮 ===== */
        .ai-float-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #26a69a, #00897b);
            color: white;
            font-size: 28px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,137,123,0.4);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: aiFloatPulse 2s infinite;
        }

        /* ===== 语音唤起麦克风指示器 ===== */
        .wake-mic-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(38, 166, 154, 0.15);
            border: 2px solid rgba(38, 166, 154, 0.3);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #26a69a;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .wake-mic-indicator.listening {
            display: flex;
            animation: wakeMicIdle 2s infinite;
        }

        .wake-mic-indicator.speaking {
            display: flex;
            background: rgba(38, 166, 154, 0.6);
            border-color: #26a69a;
            transform: scale(1.3);
            animation: wakeMicSpeaking 0.4s infinite;
            box-shadow: 0 0 16px rgba(38, 166, 154, 0.5);
        }

        @keyframes wakeMicIdle {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes wakeMicSpeaking {
            0%, 100% { transform: scale(1.2); }
            50% { transform: scale(1.35); }
        }

        /* ===== 语音命令执行提示 ===== */
        .voice-command-toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(38, 166, 154, 0.95);
            color: white;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            z-index: 3000;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            animation: toastSlideIn 0.3s ease-out;
        }

        .voice-command-toast.show {
            display: flex;
        }

        @keyframes toastSlideIn {
            from { top: 60px; opacity: 0; }
            to { top: 80px; opacity: 1; }
        }

        .ai-float-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(0,137,123,0.5);
        }

        @keyframes aiFloatPulse {
            0%, 100% { box-shadow: 0 4px 16px rgba(0,137,123,0.4); }
            50% { box-shadow: 0 4px 24px rgba(0,137,123,0.6); }
        }

        /* ===== AI 聊天弹窗（居中弹窗，四周留白） ===== */
        .ai-chat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: rgba(0,0,0,0.4);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .ai-chat-overlay.active {
            display: flex;
        }

        .ai-chat-box {
            width: 800px !important;
            max-width: 800px !important;
            height: 520px;
            max-height: 75vh;
            background: #FFFDF9;
            border-radius: 24px 24px 24px 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: aiChatPopIn 0.25s ease-out;
        }

        @keyframes aiChatPopIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 键盘弹出时自动调整为底部弹出 */
        @media (max-height: 700px) {
            .ai-chat-overlay {
                align-items: flex-end;
                padding: 20px 12px 12px 12px;
            }

            .ai-chat-box {
                max-width: 100%;
                width: 100% !important;
                height: 60vh;
                max-height: none;
                border-radius: 20px 20px 0 0;
                animation: none;
            }
        }

        .ai-chat-header {
            background: linear-gradient(135deg, #26a69a, #00897b);
            color: white;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .ai-chat-header h3 {
            margin: 0;
            font-size: 14px;
        }

        .ai-chat-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .ai-chat-messages {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 14px;
            min-height: 0;
        }

        .ai-msg {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
        }

        .ai-msg.bot {
            justify-content: flex-start;
        }

        .ai-msg.user {
            justify-content: flex-end;
        }

        .ai-msg-bubble {
            max-width: 90%;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
            writing-mode: horizontal-tb !important;
            text-orientation: mixed !important;
            direction: ltr;
        }

        .ai-msg.bot .ai-msg-bubble {
            background: #E0F2F1;
            color: #004D40;
            border-bottom-left-radius: 4px;
        }

        .ai-msg.user .ai-msg-bubble {
            background: #FF8C42;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-msg-bubble-content {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            flex-wrap: wrap;
            writing-mode: horizontal-tb !important;
            text-orientation: mixed !important;
            direction: ltr;
        }

        .ai-msg-bubble-content span {
            writing-mode: horizontal-tb !important;
            text-orientation: mixed !important;
            display: inline;
        }

        .ai-product-link {
            display: inline-block;
            writing-mode: horizontal-tb !important;
            text-orientation: mixed !important;
        }

        .ai-chat-input-area {
            padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid #eee;
            display: flex;
            gap: 5px;
            flex-shrink: 0;
            background: #FFFDF9;
        }

        .ai-chat-input {
            flex: 1;
            min-width: 0;
            height: 34px;
            border: 2px solid #ddd;
            border-radius: 17px;
            padding: 0 10px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .ai-chat-input:focus {
            border-color: #26a69a;
        }

        .ai-chat-send {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #26a69a;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .ai-chat-send:hover {
            background: #00897b;
        }

        .ai-chat-send:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 麦克风按钮 */
        .ai-chat-mic {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #FF8C42;
            color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .ai-chat-mic:hover {
            background: #F57C00;
        }

        .ai-chat-mic.recording {
            background: #E53935;
            animation: micPulse 1s infinite;
        }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* 语音播放按钮（在AI消息气泡旁） */
        .ai-msg-speak-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 4px;
            border-radius: 4px;

<script>
    // 自动获取当前页面地址，支持手机通过局域网访问
    const API = window.location.origin;
    let currentUser = null; // { userId, name, relation }
    let cartItems = [];
    let selectedRole = null; // 当前选择的身份：'elder' 或 'child'
    let lastPage = null; // 记录进入详情页之前的页面，用于返回
    let currentCategory = null; // 当前浏览的大分类
    let currentSubcategory = 'all'; // 当前选中的子分类

    // ============ 页面切换 ============
    const AI_PAGES = ['page1', 'page2', 'page3', 'page4', 'page5', 'page6', 'page8', 'page9', 'page10']; // 显示AI按钮的页面

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');

        // 控制 AI 浮动按钮显示/隐藏
        const floatBtn = document.getElementById('aiFloatBtn');
        if (floatBtn) {
            if (AI_PAGES.includes(pageId) && currentUser && currentUser.relation !== 'child') {
                floatBtn.style.display = 'flex';
            } else {
                floatBtn.style.display = 'none';
            }
        }
    }

    function go(num) {
        if (num === 1) {
            // 根据用户身份跳转到不同首页
            if (currentUser && currentUser.relation === 'child') {
                document.getElementById('childUserName').textContent = currentUser.name || '';
                loadPendingOrders();
                showChildTab('pending');
                showPage('page7');
            } else {
                if (currentUser) {
                    document.getElementById('name').textContent = currentUser.name || '';
                }
                showPage('page1');
            }
        } else if (num === 2) {
            currentCategory = 'food';
            currentSubcategory = 'all';
            resetSubcatButtons('foodSubcatBar');
            loadGoodsBySubcat('food', 'all', 'foodList');
            showPage('page2');
            trackBrowse('food');
        } else if (num === 3) {
            currentCategory = 'daily';
            currentSubcategory = 'all';
            resetSubcatButtons('dailySubcatBar');
            loadGoodsBySubcat('daily', 'all', 'dailyList');
            showPage('page3');
            trackBrowse('daily');
        } else if (num === 4) {
            currentCategory = 'medicine';
            currentSubcategory = 'all';
            resetSubcatButtons('medicineSubcatBar');
            loadGoodsBySubcat('medicine', 'all', 'medicineList');
            showPage('page4');
            trackBrowse('medicine');
        } else if (num === 5) {
            loadAllGoods();
            showPage('page5');
            trackBrowse(null); // 全部东西，不指定品类
            // 随便看看时加载推荐
            if (currentUser) {
                loadRecommendations();
            }
        } else if (num === 6) {
            loadCart();
            showPage('page6');
        } else if (num === 9) {
            loadMyOrders();
            showPage('page9');
        }
    }

    // ============ 身份选择 ============
    function selectRole(role) {
        selectedRole = role;
        const roleLabel = role === 'elder' ? '👴 老人' : '👨 子女';

        // 更新登录页面标题
        const loginTitle = document.getElementById('loginTitle');
        if (loginTitle) loginTitle.textContent = `${roleLabel}登录`;

        // 更新注册页面标题和显示
        const registerTitle = document.getElementById('registerTitle');
        if (registerTitle) registerTitle.textContent = `${roleLabel}注册`;

        // 子女注册时显示父母手机号输入框
        const childExtra = document.getElementById('childRegExtra');
        if (childExtra) {
            childExtra.classList.toggle('hidden', role !== 'child');
        }

        showPage('pageLogin');
    }

    // ============ 用户认证 ============
    async function register() {
        if (!selectedRole) { alert('请先选择身份'); return; }

        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const name = document.getElementById('regName').value.trim();
        const parentPhone = document.getElementById('regParentPhone').value.trim();

        if (!phone) { alert('请输入手机号'); return; }
        if (!password) { alert('请输入密码'); return; }
        if (!name) { alert('请输入您的称呼'); return; }
        if (selectedRole === 'child' && !parentPhone) { alert('请输入父母手机号以完成绑定'); return; }

        try {
            const res = await fetch(`${API}/api/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone, password, name,
                    relation: selectedRole,
                    parentPhone: selectedRole === 'child' ? parentPhone : undefined
                })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            alert('注册成功！请登录');
            showPage('pageLogin');
        } catch (e) {

    function renderCart() {

                    <button class="cart-item-remove" onclick="removeCartItem('${item.id}')">删除</button>
                </div>
            `;
        });
        document.getElementById('total').textContent = total.toFixed(1);
    }

    // ============ 去付钱 ============
    async function pay() {
        if (cartItems.length === 0) {
            alert('您还没有选任何东西哦！');
            return;
        }

        const total = cartItems.reduce((sum, item) => sum + item.price, 0);

        // === 智能提醒检测 ===
        const hasMedicine = cartItems.some(item =>
            item.name.includes('维生素') || item.name.includes('钙片') ||
            item.name.includes('鱼油') || item.name.includes('体温计') ||
            item.name.includes('口罩') || item.name.includes('葡萄糖') ||
            item.name.includes('护手霜') || item.name.includes('创可贴')
        );
        const isLargeAmount = total > 100;

        // 如果有药品或大额消费，显示智能提醒
        if (hasMedicine || isLargeAmount) {
            const reminderMsgs = [];
            if (hasMedicine) {
                const medNames = cartItems.filter(item =>
                    item.name.includes('维生素') || item.name.includes('钙片') ||
                    item.name.includes('鱼油') || item.name.includes('体温计') ||
                    item.name.includes('口罩') || item.name.includes('葡萄糖') ||
                    item.name.includes('护手霜') || item.name.includes('创可贴')
                ).map(i => i.name).join('、');
                reminderMsgs.push(`📦 检测到药品：${medNames}`);
            }
            if (isLargeAmount) {
                reminderMsgs.push(`💰 要买的东西金额较大：¥${total.toFixed(1)}`);
            }

            const confirmMsg = `⚠️ 智能安全提醒\n\n${reminderMsgs.join('\n')}\n\n👨‍👧‍👦 提交后，您的子女会收到通知并帮您付钱。\n\n确定要提交吗？`;
            if (!confirm(confirmMsg)) return;
        } else {
            if (!confirm('确定要提交，请子女帮忙付钱吗？')) return;
        }

        try {
            const res = await fetch(`${API}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.userId,
                    items: cartItems,
                    total
                })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }

            // 显示成功 + 智能提醒结果
            let successMsg = '要买的东西已提交！编号：' + data.order.id + '\n等待子女帮忙付钱……';
            if (data.smartReminder) {
                successMsg += '\n\n🔔 已自动通知子女关注';
            }
            alert(successMsg);

            cartItems = [];
            renderCart();
            go(1);
        } catch (e) {
            alert('网络错误');
        }
    }

    // ========== 新增：AI 购物建议功能 ==========
    async function getAiShoppingAdvice() {
        // 1. 检查用户是否已登录
        if (!currentUser) {
            alert("请先登录后获取建议。");
            return;
        }

        // 2. 获取购物车内容
        const adviceContentDiv = document.getElementById('aiAdviceContent');
        if (!adviceContentDiv) return;

        // 显示加载状态
        adviceContentDiv.innerHTML = '<span style="color: #00796b;">🤔 AI 正在分析您的购物清单，请稍候...</span>';
    
        // 3. 获取最新购物车数据
        try {
            const cartRes = await fetch(`${API}/api/cart/${currentUser.userId}`);
            if (!cartRes.ok) {
                throw new Error("获取购物车失败");
            }
            const cartItems = await cartRes.json(); // 假设返回 [{id, name, price, ...}, ...]
            
            if (!cartItems || cartItems.length === 0) {
                adviceContentDiv.innerHTML = "您还没有选好任何东西。先去逛逛，添加些心仪的东西再来找我咨询吧！🛒";
                return;
            }

            // 准备要发送给后端的东西列表，只提取 name 和 price
            const itemsForAI = cartItems.map(item => ({
                name: item.name,
                price: item.price
            }));
    
            // 4. 调用后端的新接口 /api/ai-advice
            const response = await fetch(`${API}/api/ai-advice`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ items: itemsForAI })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "获取建议失败");
            }

            // 5. 成功获取建议，显示在页面上
            if (data.success && data.advice) {

            } else {
                throw new Error("获取建议失败，请稍后重试");

        } catch (error) {

            adviceContentDiv.innerHTML = `😵 获取建议失败：${error.message || "网络错误，请稍后重试"}`;

    // 检测浏览器是否支持语音识别
    let browserSupportsSpeech = false;

    // 初始化语音唤起识别（后台持续监听）
    function initWakeRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            browserSupportsSpeech = false;
            console.warn('浏览器不支持 Web Speech API，语音唤起不可用');
            showNotSupportedToast();
            return null;
        }

        const rec = new SpeechRecognition();
        rec.lang = 'zh-CN';
        rec.interimResults = true;  // 中间结果也要，更快检测
        rec.continuous = true;      // 连续模式
        rec.maxAlternatives = 1;

        rec.onresult = (event) => {
            // 收集所有结果（包括中间和最终）
            let allText = '';
            let hasInterim = false;
            for (let i = event.resultIndex; i < event.results.length; i++) {
                allText += event.results[i][0].transcript;
                if (!event.results[i].isFinal) {
                    hasInterim = true;
                }
            }

            console.log('🎤 语音识别结果:', allText);

            // 检测到人声，显示麦克风指示器
            if (allText && isWakeListening) {
                showMicIndicator(hasInterim ? 'speaking' : 'listening');
                // 清除之前的定时器
                if (speechDetectedTimeout) clearTimeout(speechDetectedTimeout);
                // 3秒后恢复为普通监听状态
                speechDetectedTimeout = setTimeout(() => {
                    if (isWakeListening) showMicIndicator('listening');
                }, 3000);
            }

            // 立即检查唤醒词（不区分最终/中间结果）
            if (allText) {
                // 标准化文本：移除所有标点符号和空格，用于匹配
                const normalized = allText.replace(/[，。！？、\s，．；：""''（）【】《》]/g, '');
                console.log('🔍 标准化后:', normalized);
                for (const wakeWord of WAKE_WORDS) {
                    const normalizedWord = wakeWord.replace(/[，。！？、\s，．；：""''（）【】《》]/g, '');
                    if (normalized.includes(normalizedWord)) {
                        console.log('✅ 匹配唤醒词:', wakeWord);
                        onWakeWordDetected(allText, wakeWord);
                        return;
                    }
                }
            }
        };

        rec.onstart = () => {
            console.log('🎙 语音唤起监听已启动');
            console.log('📢 当前 isWakeListening =', isWakeListening);
            showMicIndicator('listening');
            console.log('📢 已调用 showMicIndicator(listening)');
        };

        rec.onerror = (event) => {
            if (event.error === 'no-speech') {
                // 无语音，静默
            } else if (event.error === 'not-allowed') {
                console.warn('麦克风权限被拒绝，语音唤起不可用');
                isWakeListening = false;
                showMicIndicator('hidden');
            } else if (event.error === 'network') {
                console.warn('网络错误，语音唤起暂时不可用');
            } else {
                console.warn('语音唤起错误:', event.error);
            }
        };

        rec.onend = () => {
            // 自动重启（保持后台监听）
            if (isWakeListening) {
                wakeRestartCount++;
                // 限制重启次数，避免无限循环
                if (wakeRestartCount < 50) {
                    setTimeout(() => {
                        if (isWakeListening && wakeRecognition) {
                            try {
                                wakeRecognition.start();
                            } catch (e) {
                                console.warn('重启语音唤起失败:', e);
                            }
                        }
                    }, 250); // 快速重启
                }
            }
        };

        return rec;
    }

    // 唤醒词被触发
    function onWakeWordDetected(fullText, wakeWord) {
        console.log('✅ 唤醒词触发:', fullText, '匹配:', wakeWord);
        // 停止监听，隐藏指示器
        stopWakeListening();
        showMicIndicator('hidden');

        // 检查是否已登录
        if (!currentUser) {
            speakWithBrowserTTS('请先登录后使用');
            restartWakeListening();
            return;
        }

        // 检查是否是老人用户
        if (currentUser.relation === 'child') {
            speakWithBrowserTTS('子女账号暂不支持');
            restartWakeListening();
            return;
        }

        // 提取唤醒词后面的内容（标准化：移除标点后再替换）
        const normalizedText = fullText.replace(/[，。！？、\s，．；：""''（）【】《》]/g, '');
        const normalizedWord = wakeWord.replace(/[，。！？、\s，．；：""''（）【】《》]/g, '');
        const questionAfterWake = normalizedText.replace(normalizedWord, '').trim();
        console.log('📝 唤醒词后内容:', questionAfterWake);

        if (questionAfterWake && questionAfterWake.length > 0) {
            // 有后续内容，先尝试语音命令
            processVoiceCommand(questionAfterWake).then(handled => {
                if (!handled) {
                    // 不是命令，打开AI对话
                    openAiChat();
                    setTimeout(() => {
                        const input = document.getElementById('aiChatInput');
                        input.value = questionAfterWake;
                        sendAiMessage();
                    }, 800);
                }
            });
        } else {
            // 只有唤醒词，打开AI聊天
            openAiChat();
            setTimeout(() => {
                speakWithBrowserTTS('在呢，请问有什么可以帮您？');
            }, 300);
        }
    }

    // 显示不支持语音的提示横幅
    function showNotSupportedToast() {
        // 检查是否已经显示过
        if (document.getElementById('speechNotSupportedBanner')) return;

        const banner = document.createElement('div');
        banner.id = 'speechNotSupportedBanner';
        banner.style.cssText = `
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FF8C42, #F57C00);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 9999;
            box-shadow: 0 4px 12px rgba(255,140,66,0.4);
            text-align: center;
            max-width: 90%;
            animation: toastSlideIn 0.3s ease-out;
        `;
        banner.innerHTML = `
            <div style="font-weight:bold;margin-bottom:4px;">📱 Safari 不支持语音唤起</div>
            <div>请点击右下角 🤖 按钮打开AI助手</div>
            <div style="margin-top:6px;font-size:11px;opacity:0.9;">建议使用 Chrome 或 Edge 浏览器获得完整体验</div>
        `;
        document.body.appendChild(banner);

        // 5秒后自动消失
        setTimeout(() => {
            banner.style.transition = 'opacity 0.5s';
            banner.style.opacity = '0';
            setTimeout(() => banner.remove(), 500);
        }, 5000);
    }

    // 开始语音唤起监听
    function startWakeListening() {
        if (isWakeListening) return;

        // 检查浏览器支持
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            browserSupportsSpeech = false;
            console.warn('浏览器不支持语音唤起');
            return;
        }
        browserSupportsSpeech = true;

        wakeRecognition = initWakeRecognition();
        if (!wakeRecognition) return;

        try {
            wakeRecognition.start();
            isWakeListening = true;
            wakeRestartCount = 0;
            console.log('🎙 语音唤起已启动，说"你好小伴"即可打开AI助手');
        } catch (e) {
            console.warn('启动语音唤起失败:', e);
            // 延迟重试
            setTimeout(() => {
                if (!isWakeListening) startWakeListening();
            }, 3000);
        }
    }

    // 停止语音唤起监听
    function stopWakeListening() {
        isWakeListening = false;
        wakeRestartCount = 0;
        if (speechDetectedTimeout) {
            clearTimeout(speechDetectedTimeout);
            speechDetectedTimeout = null;
        }
        if (wakeRecognition) {
            try { wakeRecognition.abort(); } catch (e) {}
            try { wakeRecognition.stop(); } catch (e) {}
            wakeRecognition = null;
        }
    }

    // 重启语音唤起监听
    function restartWakeListening() {
        wakeRestartCount = 0;
        setTimeout(() => {
            if (currentUser && currentUser.relation !== 'child') {
                startWakeListening();
            }
        }, 3000);
    }

    // 初始化语音识别（聊天窗口内的语音输入）
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            browserSupportsSpeech = false;
            console.error('浏览器不支持 Web Speech API');
            return null;
        }

        const rec = new SpeechRecognition();
        rec.lang = 'zh-CN';
        rec.interimResults = true;
        rec.continuous = true;

        rec.onresult = (event) => {
            const input = document.getElementById('aiChatInput');
            let interimTranscript = '';
            finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += transcript;
                } else {
                    interimTranscript += transcript;
                }
            }

            const displayText = finalTranscript + interimTranscript;
            input.value = displayText;
            input.placeholder = interimTranscript ? '🎙 正在识别...' : '问我任何购物问题...';
        };

        rec.onerror = (event) => {
            console.error('语音识别错误:', event.error);
            if (event.error === 'not-allowed') {
                alert('无法获取麦克风权限，请确保浏览器允许访问麦克风');
            }
            stopRecording();
        };

        rec.onend = () => {
            if (isRecording) {
                try {
                    rec.start();
                } catch (e) {
                    stopRecording();
                }
            } else {
                if (finalTranscript.trim()) {
                    const input = document.getElementById('aiChatInput');
                    input.value = finalTranscript.trim();
                    input.placeholder = '问我任何购物问题...';
                    sendAiMessage();
                }
            }
        };

        return rec;
    }

    // 切换录音状态
    function toggleVoiceRecord() {
        const micBtn = document.getElementById('aiChatMicBtn');

        if (!isRecording) {
            // 检查浏览器支持
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Safari 不支持语音识别\n\n请使用以下方式：\n1. 直接在输入框打字\n2. 使用 Chrome 浏览器获得语音体验');
                return;
            }

            // 开始录音
            if (!recognition) {
                recognition = initSpeechRecognition();
            }

            if (!recognition) {
                alert('您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器');
                return;
            }

            finalTranscript = '';
            const input = document.getElementById('aiChatInput');
            input.value = '';
            input.placeholder = '🎙 请说话...';

            try {
                recognition.start();
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.innerHTML = '⏹';
                micBtn.title = '停止录音';
            } catch (err) {
                console.error('启动语音识别失败:', err);
            }
        } else {
            // 停止录音
            stopRecording();
        }
    }

    // 停止录音
    function stopRecording() {
        const micBtn = document.getElementById('aiChatMicBtn');

        if (recognition && isRecording) {
            recognition.stop();
        }

        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.innerHTML = '🎤';
        micBtn.title = '语音输入';

        const input = document.getElementById('aiChatInput');
        input.placeholder = '问我任何购物问题...';
    }

    // 移除文本中的 Emoji 和特殊符号（TTS 无法正确朗读）
    function stripEmojis(text) {
        // 移除 Emoji 字符（Unicode 范围）
        return text
            .replace(/[\u{1F600}-\u{1F64F}]|[\u{1F300}-\u{1F5FF}]|[\u{1F680}-\u{1F6FF}]|[\u{1F1E0}-\u{1F1FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{FE00}-\u{FE0F}]|[\u{1F900}-\u{1F9FF}]|[\u{1FA00}-\u{1FA6F}]|[\u{1FA70}-\u{1FAFF}]|[\u{200D}]|[\u{20E3}]|[\u{E0020}-\u{E007F}]/gu, '')
            // 移除多余空白
            .replace(/\n+/g, '。')
            .replace(/  +/g, ' ')
            .trim();
    }

    // 语音合成：先尝试百度 TTS，失败则降级浏览器 TTS
    async function speakText(text) {
        if (!text) return;

        // 清理 emoji 和特殊字符
        const cleanText = stripEmojis(text);
        if (!cleanText) return;

        // 先尝试百度 TTS（更自然的声音）
        try {
            const res = await fetch(`${API}/api/speech/tts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: cleanText })
            });

            if (res.ok) {
                const audioBlob = await res.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                if (currentAudioElement) {
                    currentAudioElement.pause();
                }
                currentAudioElement = new Audio(audioUrl);
                await currentAudioElement.play();
                currentAudioElement.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    currentAudioElement = null;
                };
                return;
            }
        } catch (e) {
            console.warn('百度 TTS 失败，降级浏览器 TTS:', e);
        }

        // 降级：浏览器内置 TTS
        speakWithBrowserTTS(cleanText);
    }

    // 浏览器内置 TTS
    function speakWithBrowserTTS(text) {
        if (!('speechSynthesis' in window)) return;

        // 停止之前的语音
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.85;   // 稍慢，适合老年人
        utterance.pitch = 1.0;   // 正常音调
        utterance.volume = 1.0;

        // 尝试选择更自然的中文语音
        const voices = window.speechSynthesis.getVoices();
        const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
        // 优先选择 Google 或 Microsoft 的自然语音
        const preferred = zhVoices.find(v =>
            v.name.includes('Google') || v.name.includes('Microsoft') || v.name.includes('Xiaoxiao')
        );
        if (preferred) {
            utterance.voice = preferred;
        } else if (zhVoices.length > 0) {
            utterance.voice = zhVoices[0];
        }

        window.speechSynthesis.speak(utterance);
    }

    // 预加载语音列表（部分浏览器需要）
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    // 发送欢迎消息（固定欢迎词）
    async function sendAiWelcome() {
        // 移除加载提示
        const messagesDiv = document.getElementById('aiChatMessages');
        if (messagesDiv.lastChild) messagesDiv.lastChild.remove();

        const welcomeText = '叔叔阿姨好呀！我是您的购物助手小伴😊。咱们这里有16种食品饮料、14种日用品、10种药品保健，都是适合您的宝贝！您随时可以问我："推荐适合老人的零食"、"帮我找降压药"、"牛奶多少钱"或者"看看购物车"。有啥需要尽管说，小伴帮您挑最合适的！';
        addChatMessage('bot', welcomeText);
        aiChatHistory.push({ role: 'bot', content: welcomeText });
        // 自动语音播报
        speakText(welcomeText);
        aiWelcomeLoading = false;
    }

    // 发送用户消息
    async function sendAiMessage() {
        const input = document.getElementById('aiChatInput');
        const question = input.value.trim();
        if (!question) return;

        // 隐藏快捷问题（用户开始对话后）
        document.getElementById('aiQuickQuestions').style.display = 'none';

        // 显示用户消息
        addChatMessage('user', question);
        aiChatHistory.push({ role: 'user', content: question });
        input.value = '';

        // 隐藏之前的子女通知
        document.getElementById('aiChildNotify').classList.remove('show');

        // 禁用发送按钮，显示加载
        const sendBtn = document.getElementById('aiChatSendBtn');
        sendBtn.disabled = true;

        // 显示"AI正在思考"
        addChatMessage('bot', '🤔 正在思考...');

        try {
            // 获取当前购物车
            let items = [];
            try {
                const cartRes = await fetch(`${API}/api/cart/${currentUser.userId}`);
                if (cartRes.ok) {
                    items = (await cartRes.json()).map(i => ({ name: i.name, price: i.price }));
                }
            } catch (e) {}

            // 发送对话历史（最近10条）
            const historyToSend = aiChatHistory.slice(0, -1).slice(-10);

            const res = await fetch(`${API}/api/ai-advice`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question,
                    items,
                    chatHistory: historyToSend,
                    context: { scene: currentScene, goodsList: currentGoodsList }
                })
            });

            const data = await res.json();

            // 移除加载提示
            const messagesDiv = document.getElementById('aiChatMessages');
            messagesDiv.lastChild.remove();

            if (data.success) {
                addChatMessage('bot', data.advice);
                aiChatHistory.push({ role: 'bot', content: data.advice });
                // 自动语音播报
                speakText(data.advice.replace(/【|】/g, ''));

                // 执行后端检测到的动作（加购/导航/结算）
                if (data.action) {
                    console.log('🎯 执行AI动作:', data.action);
                    executeAiAction(data.action);
                }

                // 处理子女联动通知
                if (data.notifyChild) {
                    const notifyEl = document.getElementById('aiChildNotify');
                    const notifyText = document.getElementById('aiChildNotifyText');
                    const reasonText = data.notifyChild.reason === '药品购买'
                        ? '检测到药品购买，已通知子女关注'
                        : `购物车金额 ¥${data.notifyChild.total.toFixed(1)}，已通知子女关注`;
                    notifyText.textContent = reasonText;
                    notifyEl.classList.add('show');
                }
            } else {
                const errorText = '抱歉，我暂时无法回答，请稍后再试。';
                addChatMessage('bot', errorText);
                // 自动语音播报
                speakText(errorText);
            }
        } catch (e) {
            const messagesDiv = document.getElementById('aiChatMessages');
            messagesDiv.lastChild.remove();
            const errorText = '网络错误，请稍后再试。';
            addChatMessage('bot', errorText);
            // 自动语音播报
            speakText(errorText);
        } finally {
            sendBtn.disabled = false;
        }
    }

    // 重写 loadGoods 和 loadAllGoods 以记录当前商品列表
    const originalLoadGoods = loadGoods;
    loadGoods = async function(category, containerId) {

            currentGoodsList = await res.json();

    const originalLoadAllGoods = loadAllGoods;
    loadAllGoods = async function() {

            const res = await fetch(`${API}/api/goods`);

    // ============ 初始化 ============
    checkLogin();
    if (currentUser) {
        // 已登录：直接进入对应首页
        selectedRole = currentUser.relation;
        if (currentUser.relation === 'child') {
            document.getElementById('childUserName').textContent = currentUser.name || '';

            showChildTab('pending');
            showPage('page7');

            document.getElementById('name').textContent = currentUser.name || '';
            showPage('page1');
        }
    }
    // 未登录：默认显示身份选择页面（pageRoleSelect 已在 HTML 中设为 active）

    // 启动语音唤起监听（后台持续监听"你好小伴"）
    // 延迟 1 秒启动，确保页面加载完成
    setTimeout(() => {
        startWakeListening();
    }, 1000);
